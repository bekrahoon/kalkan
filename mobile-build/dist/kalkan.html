2.3. \u0414\u043B\u044F \u0444\u0443\u043D\u043A\u0446\u0438\u0438 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u043E\u0439 \u043E\u0442\u043C\u0435\u0442\u043A\u0438 \u0434\u0440\u0443\u0437\u0435\u0439 \u043C\u044B \u0441\u043E\u0437\u0434\u0430\u0451\u043C \u0438 \u0445\u0440\u0430\u043D\u0438\u043C \u0431\u0438\u043E\u043C\u0435\u0442\u0440\u0438\u0447\u0435\u0441\u043A\u0438\u0435 \u0448\u0430\u0431\u043B\u043E\u043D\u044B \u043B\u0438\u0446\u0430 \u043D\u0430 \u043E\u0441\u043D\u043E\u0432\u0435 \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043D\u043D\u044B\u0445 \u0444\u043E\u0442\u043E\u0433\u0440\u0430\u0444\u0438\u0439.
2.4. \u041C\u044B \u0441\u043E\u0431\u0438\u0440\u0430\u0435\u043C \u0434\u0430\u043D\u043D\u044B\u0435 \u043E \u0442\u043E\u0447\u043D\u043E\u043C \u043C\u0435\u0441\u0442\u043E\u043F\u043E\u043B\u043E\u0436\u0435\u043D\u0438\u0438 \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0430, \u0432 \u0442\u043E\u043C \u0447\u0438\u0441\u043B\u0435 \u0432 \u0444\u043E\u043D\u043E\u0432\u043E\u043C \u0440\u0435\u0436\u0438\u043C\u0435, \u043A\u043E\u0433\u0434\u0430 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u0435 \u043D\u0435 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442\u0441\u044F.
2.5. \u041C\u044B \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u0438 \u0441\u043E\u0431\u0438\u0440\u0430\u0435\u043C \u0441\u0432\u0435\u0434\u0435\u043D\u0438\u044F \u043E\u0431 \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0435, IP-\u0430\u0434\u0440\u0435\u0441, \u0438\u0441\u0442\u043E\u0440\u0438\u044E \u043F\u0440\u043E\u0441\u043C\u043E\u0442\u0440\u043E\u0432 \u0432\u043D\u0443\u0442\u0440\u0438 \u0441\u0435\u0440\u0432\u0438\u0441\u0430, \u0430 \u0442\u0430\u043A\u0436\u0435 \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u044E \u043E \u043F\u043E\u0441\u0435\u0449\u0435\u043D\u0438\u0438 \u0441\u0442\u043E\u0440\u043E\u043D\u043D\u0438\u0445 \u0441\u0430\u0439\u0442\u043E\u0432, \u043D\u0430 \u043A\u043E\u0442\u043E\u0440\u044B\u0445 \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u0435\u043D\u044B \u043D\u0430\u0448\u0438 \u043F\u0438\u043A\u0441\u0435\u043B\u0438.
2.6. \u0421 \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u044F \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u044F \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u0435 \u043F\u043E\u043B\u0443\u0447\u0430\u0435\u0442 \u0434\u043E\u0441\u0442\u0443\u043F \u043A \u043A\u0430\u043C\u0435\u0440\u0435 \u0438 \u043C\u0438\u043A\u0440\u043E\u0444\u043E\u043D\u0443.

3. \u0414\u0435\u0442\u0438
\u0421\u0435\u0440\u0432\u0438\u0441 \u043F\u0440\u0435\u0434\u043D\u0430\u0437\u043D\u0430\u0447\u0435\u043D \u0434\u043B\u044F \u043B\u0438\u0446 \u0441\u0442\u0430\u0440\u0448\u0435 13 \u043B\u0435\u0442. \u041C\u044B \u043D\u0435 \u043F\u0440\u043E\u0432\u0435\u0440\u044F\u0435\u043C \u0432\u043E\u0437\u0440\u0430\u0441\u0442 \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u0435\u0439 \u0438 \u043D\u0435 \u0442\u0440\u0435\u0431\u0443\u0435\u043C \u0441\u043E\u0433\u043B\u0430\u0441\u0438\u044F \u0440\u043E\u0434\u0438\u0442\u0435\u043B\u0435\u0439.

4. \u041A\u0430\u043A \u043C\u044B \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u043C \u0434\u0430\u043D\u043D\u044B\u0435
\u041C\u044B \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u043C \u0434\u0430\u043D\u043D\u044B\u0435 \u0434\u043B\u044F \u0440\u0430\u0431\u043E\u0442\u044B \u0441\u0435\u0440\u0432\u0438\u0441\u0430, \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u0438\u0437\u0430\u0446\u0438\u0438 \u043B\u0435\u043D\u0442\u044B, \u0440\u0435\u043A\u043B\u0430\u043C\u044B \u0438 \u0443\u043B\u0443\u0447\u0448\u0435\u043D\u0438\u044F \u043D\u0430\u0448\u0438\u0445 \u0430\u043B\u0433\u043E\u0440\u0438\u0442\u043C\u043E\u0432, \u0432\u043A\u043B\u044E\u0447\u0430\u044F \u043E\u0431\u0443\u0447\u0435\u043D\u0438\u0435 \u043C\u043E\u0434\u0435\u043B\u0435\u0439 \u0438\u0441\u043A\u0443\u0441\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0433\u043E \u0438\u043D\u0442\u0435\u043B\u043B\u0435\u043A\u0442\u0430 \u043D\u0430 \u0432\u0430\u0448\u0438\u0445 \u043F\u0443\u0431\u043B\u0438\u043A\u0430\u0446\u0438\u044F\u0445.

5. \u041F\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u0434\u0430\u043D\u043D\u044B\u0445
5.1. \u041C\u044B \u043C\u043E\u0436\u0435\u043C \u043F\u0435\u0440\u0435\u0434\u0430\u0432\u0430\u0442\u044C \u0438 \u043F\u0440\u043E\u0434\u0430\u0432\u0430\u0442\u044C \u043E\u0431\u0435\u0437\u043B\u0438\u0447\u0435\u043D\u043D\u044B\u0435 \u0438 \u043D\u0435\u043E\u0431\u0435\u0437\u043B\u0438\u0447\u0435\u043D\u043D\u044B\u0435 \u0434\u0430\u043D\u043D\u044B\u0435 \u0440\u0435\u043A\u043B\u0430\u043C\u043D\u044B\u043C \u043F\u0430\u0440\u0442\u043D\u0451\u0440\u0430\u043C \u0438 \u0438\u043D\u044B\u043C \u0442\u0440\u0435\u0442\u044C\u0438\u043C \u043B\u0438\u0446\u0430\u043C \u0434\u043B\u044F \u043F\u043E\u043A\u0430\u0437\u0430 \u0442\u0430\u0440\u0433\u0435\u0442\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u043E\u0439 \u0440\u0435\u043A\u043B\u0430\u043C\u044B.
5.2. \u0414\u0430\u043D\u043D\u044B\u0435 \u043C\u043E\u0433\u0443\u0442 \u043F\u0435\u0440\u0435\u0434\u0430\u0432\u0430\u0442\u044C\u0441\u044F \u0430\u0444\u0444\u0438\u043B\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u043C \u043A\u043E\u043C\u043F\u0430\u043D\u0438\u044F\u043C \u0438 \u043E\u0431\u0440\u0430\u0431\u0430\u0442\u044B\u0432\u0430\u0442\u044C\u0441\u044F \u043D\u0430 \u0441\u0435\u0440\u0432\u0435\u0440\u0430\u0445, \u0440\u0430\u0441\u043F\u043E\u043B\u043E\u0436\u0435\u043D\u043D\u044B\u0445 \u0432 \u0434\u0440\u0443\u0433\u0438\u0445 \u0441\u0442\u0440\u0430\u043D\u0430\u0445, \u0433\u0434\u0435 \u0443\u0440\u043E\u0432\u0435\u043D\u044C \u0437\u0430\u0449\u0438\u0442\u044B \u0434\u0430\u043D\u043D\u044B\u0445 \u043C\u043E\u0436\u0435\u0442 \u0431\u044B\u0442\u044C \u043D\u0438\u0436\u0435.
5.3. \u041C\u044B \u0440\u0430\u0441\u043A\u0440\u044B\u0432\u0430\u0435\u043C \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u044E \u0433\u043E\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u043C \u043E\u0440\u0433\u0430\u043D\u0430\u043C \u043F\u043E \u0438\u0445 \u0437\u0430\u043F\u0440\u043E\u0441\u0443.

6. \u0425\u0440\u0430\u043D\u0435\u043D\u0438\u0435 \u0434\u0430\u043D\u043D\u044B\u0445
\u041C\u044B \u0445\u0440\u0430\u043D\u0438\u043C \u0434\u0430\u043D\u043D\u044B\u0435 \u0441\u0442\u043E\u043B\u044C\u043A\u043E, \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u044D\u0442\u043E \u043D\u0435\u043E\u0431\u0445\u043E\u0434\u0438\u043C\u043E \u0434\u043B\u044F \u0446\u0435\u043B\u0435\u0439 \u0431\u0438\u0437\u043D\u0435\u0441\u0430. \u0420\u0435\u0437\u0435\u0440\u0432\u043D\u044B\u0435 \u043A\u043E\u043F\u0438\u0438 \u043C\u043E\u0433\u0443\u0442 \u0445\u0440\u0430\u043D\u0438\u0442\u044C\u0441\u044F \u0431\u0435\u0441\u0441\u0440\u043E\u0447\u043D\u043E.

7. \u0412\u0430\u0448\u0438 \u043F\u0440\u0430\u0432\u0430
\u0412\u044B \u043C\u043E\u0436\u0435\u0442\u0435 \u0438\u0437\u043C\u0435\u043D\u0438\u0442\u044C \u0434\u0430\u043D\u043D\u044B\u0435 \u043F\u0440\u043E\u0444\u0438\u043B\u044F \u0432 \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430\u0445. \u0423\u0434\u0430\u043B\u0435\u043D\u0438\u0435 \u0430\u043A\u043A\u0430\u0443\u043D\u0442\u0430 \u043E\u0437\u043D\u0430\u0447\u0430\u0435\u0442 \u0435\u0433\u043E \u0434\u0435\u0430\u043A\u0442\u0438\u0432\u0430\u0446\u0438\u044E; \u0447\u0430\u0441\u0442\u044C \u0434\u0430\u043D\u043D\u044B\u0445 \u043C\u043E\u0436\u0435\u0442 \u0441\u043E\u0445\u0440\u0430\u043D\u0438\u0442\u044C\u0441\u044F. \u041C\u044B \u043C\u043E\u0436\u0435\u043C \u0438\u0437\u043C\u0435\u043D\u044F\u0442\u044C \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0443\u044E \u041F\u043E\u043B\u0438\u0442\u0438\u043A\u0443 \u0432 \u043B\u044E\u0431\u043E\u0435 \u0432\u0440\u0435\u043C\u044F \u0431\u0435\u0437 \u0443\u0432\u0435\u0434\u043E\u043C\u043B\u0435\u043D\u0438\u044F \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u0435\u0439.

8. \u041A\u043E\u043D\u0442\u0430\u043A\u0442\u044B
\u041F\u043E \u0432\u043E\u043F\u0440\u043E\u0441\u0430\u043C, \u0441\u0432\u044F\u0437\u0430\u043D\u043D\u044B\u043C \u0441 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u043C\u0438 \u0434\u0430\u043D\u043D\u044B\u043C\u0438: privacy@koshuna.example`,taxi:`\u041F\u043E\u043B\u0438\u0442\u0438\u043A\u0430 \u043E\u0431\u0440\u0430\u0431\u043E\u0442\u043A\u0438 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0445 \u0434\u0430\u043D\u043D\u044B\u0445 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F \xAB\u0422\u0435\u0437\u0416\u043E\u043B\xBB
\u0420\u0435\u0434\u0430\u043A\u0446\u0438\u044F \u043E\u0442 15 \u044F\u043D\u0432\u0430\u0440\u044F 2026 \u0433.

1. \u041A\u0442\u043E \u043C\u044B
\u041F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u0435 \xAB\u0422\u0435\u0437\u0416\u043E\u043B\xBB (\u0434\u0430\u043B\u0435\u0435 \u2014 \xAB\u0421\u0435\u0440\u0432\u0438\u0441\xBB) \u043F\u043E\u043C\u043E\u0433\u0430\u0435\u0442 \u0437\u0430\u043A\u0430\u0437\u0430\u0442\u044C \u043F\u043E\u0435\u0437\u0434\u043A\u0443 \u043D\u0430 \u0442\u0430\u043A\u0441\u0438. \u041E\u043F\u0435\u0440\u0430\u0442\u043E\u0440\u043E\u043C \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0445 \u0434\u0430\u043D\u043D\u044B\u0445 \u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u041E\u0441\u041E\u041E \xAB\u0422\u0435\u0437\u0416\u043E\u043B \u0422\u0435\u0445\u043D\u043E\u043B\u043E\u0434\u0436\u0438\xBB.

2. \u041A\u0430\u043A\u0438\u0435 \u0434\u0430\u043D\u043D\u044B\u0435 \u043C\u044B \u043E\u0431\u0440\u0430\u0431\u0430\u0442\u044B\u0432\u0430\u0435\u043C
\u2014 \u041D\u043E\u043C\u0435\u0440 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0430, \u0438\u043C\u044F \u0438 \u0444\u043E\u0442\u043E\u0433\u0440\u0430\u0444\u0438\u044F \u043F\u0440\u043E\u0444\u0438\u043B\u044F.
\u2014 \u0413\u0435\u043E\u043B\u043E\u043A\u0430\u0446\u0438\u044F: \u0442\u043E\u0447\u043D\u044B\u0435 \u043A\u043E\u043E\u0440\u0434\u0438\u043D\u0430\u0442\u044B \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0430 \u0432\u043E \u0432\u0440\u0435\u043C\u044F \u043F\u043E\u0438\u0441\u043A\u0430 \u0438 \u0432\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u044F \u043F\u043E\u0435\u0437\u0434\u043A\u0438, \u0430 \u0442\u0430\u043A\u0436\u0435 \u0432 \u0444\u043E\u043D\u043E\u0432\u043E\u043C \u0440\u0435\u0436\u0438\u043C\u0435 \u0432 \u0442\u0435\u0447\u0435\u043D\u0438\u0435 30 \u043C\u0438\u043D\u0443\u0442 \u043F\u043E\u0441\u043B\u0435 \u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043D\u0438\u044F \u043F\u043E\u0435\u0437\u0434\u043A\u0438 \u0434\u043B\u044F \u043E\u0431\u0435\u0441\u043F\u0435\u0447\u0435\u043D\u0438\u044F \u0431\u0435\u0437\u043E\u043F\u0430\u0441\u043D\u043E\u0441\u0442\u0438.
\u2014 \u0418\u0441\u0442\u043E\u0440\u0438\u044F \u043F\u043E\u0435\u0437\u0434\u043E\u043A: \u0430\u0434\u0440\u0435\u0441\u0430 \u043F\u043E\u0441\u0430\u0434\u043A\u0438 \u0438 \u0432\u044B\u0441\u0430\u0434\u043A\u0438, \u043C\u0430\u0440\u0448\u0440\u0443\u0442\u044B, \u0432\u0440\u0435\u043C\u044F.
\u2014 \u041F\u043B\u0430\u0442\u0451\u0436\u043D\u044B\u0435 \u0434\u0430\u043D\u043D\u044B\u0435: \u043F\u043E\u0441\u043B\u0435\u0434\u043D\u0438\u0435 \u0447\u0435\u0442\u044B\u0440\u0435 \u0446\u0438\u0444\u0440\u044B \u0431\u0430\u043D\u043A\u043E\u0432\u0441\u043A\u043E\u0439 \u043A\u0430\u0440\u0442\u044B, \u0438\u0441\u0442\u043E\u0440\u0438\u044F \u043F\u043B\u0430\u0442\u0435\u0436\u0435\u0439. \u041F\u043E\u043B\u043D\u044B\u0435 \u0434\u0430\u043D\u043D\u044B\u0435 \u043A\u0430\u0440\u0442\u044B \u043E\u0431\u0440\u0430\u0431\u0430\u0442\u044B\u0432\u0430\u0435\u0442 \u043F\u043B\u0430\u0442\u0451\u0436\u043D\u044B\u0439 \u043F\u0440\u043E\u0432\u0430\u0439\u0434\u0435\u0440, \u043C\u044B \u0438\u0445 \u043D\u0435 \u0445\u0440\u0430\u043D\u0438\u043C.
\u2014 \u0410\u0443\u0434\u0438\u043E\u0437\u0430\u043F\u0438\u0441\u044C \u043F\u043E\u0435\u0437\u0434\u043A\u0438: \u0432 \u0446\u0435\u043B\u044F\u0445 \u0431\u0435\u0437\u043E\u043F\u0430\u0441\u043D\u043E\u0441\u0442\u0438 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u0435 \u043C\u043E\u0436\u0435\u0442 \u0432\u043A\u043B\u044E\u0447\u0430\u0442\u044C \u0437\u0430\u043F\u0438\u0441\u044C \u0437\u0432\u0443\u043A\u0430 \u0432 \u0441\u0430\u043B\u043E\u043D\u0435 \u0432\u043E \u0432\u0440\u0435\u043C\u044F \u043F\u043E\u0435\u0437\u0434\u043A\u0438. \u0417\u0430\u043F\u0438\u0441\u044C \u0432\u043A\u043B\u044E\u0447\u0430\u0435\u0442\u0441\u044F \u043F\u043E \u0443\u043C\u043E\u043B\u0447\u0430\u043D\u0438\u044E; \u0435\u0451 \u043C\u043E\u0436\u043D\u043E \u043E\u0442\u043A\u043B\u044E\u0447\u0438\u0442\u044C \u0432 \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430\u0445.
\u2014 \u041C\u044B \u043D\u0435 \u0441\u043E\u0431\u0438\u0440\u0430\u0435\u043C \u0431\u0438\u043E\u043C\u0435\u0442\u0440\u0438\u0447\u0435\u0441\u043A\u0438\u0435 \u0434\u0430\u043D\u043D\u044B\u0435.

3. \u0417\u0430\u0447\u0435\u043C \u043C\u044B \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u043C \u0434\u0430\u043D\u043D\u044B\u0435
\u0414\u043B\u044F \u043F\u043E\u0434\u0431\u043E\u0440\u0430 \u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044F, \u0440\u0430\u0441\u0447\u0451\u0442\u0430 \u0441\u0442\u043E\u0438\u043C\u043E\u0441\u0442\u0438, \u043E\u0431\u0435\u0441\u043F\u0435\u0447\u0435\u043D\u0438\u044F \u0431\u0435\u0437\u043E\u043F\u0430\u0441\u043D\u043E\u0441\u0442\u0438, \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u044F \u0441\u043F\u043E\u0440\u043E\u0432, \u0430 \u0442\u0430\u043A\u0436\u0435 \u0434\u043B\u044F \u043E\u0442\u043F\u0440\u0430\u0432\u043A\u0438 \u0440\u0435\u043A\u043B\u0430\u043C\u043D\u044B\u0445 \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0435\u043D\u0438\u0439 \u0441\u0435\u0440\u0432\u0438\u0441\u0430.

4. \u041A\u043E\u043C\u0443 \u043C\u044B \u043F\u0435\u0440\u0435\u0434\u0430\u0451\u043C \u0434\u0430\u043D\u043D\u044B\u0435
\u2014 \u0412\u043E\u0434\u0438\u0442\u0435\u043B\u044E: \u0432\u0430\u0448\u0435 \u0438\u043C\u044F, \u0440\u0435\u0439\u0442\u0438\u043D\u0433 \u0438 \u043C\u0435\u0441\u0442\u043E \u043F\u043E\u0441\u0430\u0434\u043A\u0438.
\u2014 \u041F\u043B\u0430\u0442\u0451\u0436\u043D\u043E\u043C\u0443 \u043F\u0440\u043E\u0432\u0430\u0439\u0434\u0435\u0440\u0443 \u0438 \u0431\u0430\u043D\u043A\u0443-\u044D\u043A\u0432\u0430\u0439\u0435\u0440\u0443 \u0434\u043B\u044F \u043F\u0440\u043E\u0432\u0435\u0434\u0435\u043D\u0438\u044F \u043E\u043F\u043B\u0430\u0442\u044B.
\u2014 \u0421\u0442\u0440\u0430\u0445\u043E\u0432\u044B\u043C \u043A\u043E\u043C\u043F\u0430\u043D\u0438\u044F\u043C-\u043F\u0430\u0440\u0442\u043D\u0451\u0440\u0430\u043C \u0432 \u0441\u043B\u0443\u0447\u0430\u0435 \u043F\u0440\u043E\u0438\u0441\u0448\u0435\u0441\u0442\u0432\u0438\u044F.
\u2014 \u0413\u043E\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u043C \u043E\u0440\u0433\u0430\u043D\u0430\u043C \u0432 \u0441\u043B\u0443\u0447\u0430\u044F\u0445, \u043F\u0440\u0435\u0434\u0443\u0441\u043C\u043E\u0442\u0440\u0435\u043D\u043D\u044B\u0445 \u0437\u0430\u043A\u043E\u043D\u043E\u043C.
\u2014 \u0420\u0435\u043A\u043B\u0430\u043C\u043D\u044B\u043C \u043F\u0430\u0440\u0442\u043D\u0451\u0440\u0430\u043C \u2014 \u0430\u0433\u0440\u0435\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u0435 \u0441\u0432\u0435\u0434\u0435\u043D\u0438\u044F \u043E \u043C\u0430\u0440\u0448\u0440\u0443\u0442\u0430\u0445 \u0434\u043B\u044F \u0430\u043D\u0430\u043B\u0438\u0442\u0438\u043A\u0438.
\u0414\u0430\u043D\u043D\u044B\u0435 \u0445\u0440\u0430\u043D\u044F\u0442\u0441\u044F \u043D\u0430 \u0441\u0435\u0440\u0432\u0435\u0440\u0430\u0445, \u0440\u0430\u0441\u043F\u043E\u043B\u043E\u0436\u0435\u043D\u043D\u044B\u0445 \u0432 \u041A\u044B\u0440\u0433\u044B\u0437\u0441\u043A\u043E\u0439 \u0420\u0435\u0441\u043F\u0443\u0431\u043B\u0438\u043A\u0435 \u0438 \u041A\u0430\u0437\u0430\u0445\u0441\u0442\u0430\u043D\u0435.

5. \u0421\u0440\u043E\u043A\u0438 \u0445\u0440\u0430\u043D\u0435\u043D\u0438\u044F
\u0418\u0441\u0442\u043E\u0440\u0438\u044F \u043F\u043E\u0435\u0437\u0434\u043E\u043A \u0438 \u043F\u043B\u0430\u0442\u0435\u0436\u0435\u0439 \u0445\u0440\u0430\u043D\u0438\u0442\u0441\u044F 5 \u043B\u0435\u0442 \u043F\u043E\u0441\u043B\u0435 \u043F\u043E\u0441\u043B\u0435\u0434\u043D\u0435\u0439 \u043F\u043E\u0435\u0437\u0434\u043A\u0438. \u0410\u0443\u0434\u0438\u043E\u0437\u0430\u043F\u0438\u0441\u0438 \u0445\u0440\u0430\u043D\u044F\u0442\u0441\u044F 30 \u0434\u043D\u0435\u0439 \u0438 \u0437\u0430\u0442\u0435\u043C \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u0438 \u0443\u0434\u0430\u043B\u044F\u044E\u0442\u0441\u044F, \u0435\u0441\u043B\u0438 \u043F\u043E \u043D\u0438\u043C \u043D\u0435 \u043E\u0442\u043A\u0440\u044B\u0442 \u0441\u043F\u043E\u0440.

6. \u0412\u0430\u0448\u0438 \u043F\u0440\u0430\u0432\u0430
\u0412\u044B \u043C\u043E\u0436\u0435\u0442\u0435 \u0437\u0430\u043F\u0440\u043E\u0441\u0438\u0442\u044C \u043A\u043E\u043F\u0438\u044E \u0441\u0432\u043E\u0438\u0445 \u0434\u0430\u043D\u043D\u044B\u0445, \u0438\u0441\u043F\u0440\u0430\u0432\u0438\u0442\u044C \u043D\u0435\u0442\u043E\u0447\u043D\u044B\u0435 \u0434\u0430\u043D\u043D\u044B\u0435 \u0438 \u043E\u0442\u043E\u0437\u0432\u0430\u0442\u044C \u0441\u043E\u0433\u043B\u0430\u0441\u0438\u0435 \u043D\u0430 \u043F\u043E\u043B\u0443\u0447\u0435\u043D\u0438\u0435 \u0440\u0435\u043A\u043B\u0430\u043C\u044B. \u0427\u0442\u043E\u0431\u044B \u0443\u0434\u0430\u043B\u0438\u0442\u044C \u0430\u043A\u043A\u0430\u0443\u043D\u0442, \u043D\u0430\u043F\u0438\u0448\u0438\u0442\u0435 \u043D\u0430 privacy@tezjol.example \u2014 \u043C\u044B \u0443\u0434\u0430\u043B\u0438\u043C \u0434\u0430\u043D\u043D\u044B\u0435 \u0432 \u0442\u0435\u0447\u0435\u043D\u0438\u0435 30 \u0434\u043D\u0435\u0439, \u0437\u0430 \u0438\u0441\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435\u043C \u0441\u0432\u0435\u0434\u0435\u043D\u0438\u0439, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u043E\u0431\u044F\u0437\u0430\u043D\u044B \u0445\u0440\u0430\u043D\u0438\u0442\u044C \u043F\u043E \u0437\u0430\u043A\u043E\u043D\u0443.`,shop:`\u041F\u043E\u043B\u0438\u0442\u0438\u043A\u0430 \u043A\u043E\u043D\u0444\u0438\u0434\u0435\u043D\u0446\u0438\u0430\u043B\u044C\u043D\u043E\u0441\u0442\u0438 \u0438\u043D\u0442\u0435\u0440\u043D\u0435\u0442-\u043C\u0430\u0433\u0430\u0437\u0438\u043D\u0430 \xAB\u0411\u0430\u0437\u0430\u0440\u0447\u0438\u043A\xBB
\u0414\u0430\u0442\u0430 \u0432\u0441\u0442\u0443\u043F\u043B\u0435\u043D\u0438\u044F \u0432 \u0441\u0438\u043B\u0443: 1 \u0441\u0435\u043D\u0442\u044F\u0431\u0440\u044F 2025 \u0433.

\u041C\u044B \u0441\u043E\u0431\u0438\u0440\u0430\u0435\u043C \u0442\u043E\u043B\u044C\u043A\u043E \u0442\u0435 \u0434\u0430\u043D\u043D\u044B\u0435, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u043D\u0443\u0436\u043D\u044B \u0434\u043B\u044F \u043E\u0444\u043E\u0440\u043C\u043B\u0435\u043D\u0438\u044F \u0438 \u0434\u043E\u0441\u0442\u0430\u0432\u043A\u0438 \u0437\u0430\u043A\u0430\u0437\u0430.

1. \u041A\u0430\u043A\u0438\u0435 \u0434\u0430\u043D\u043D\u044B\u0435 \u043C\u044B \u0441\u043E\u0431\u0438\u0440\u0430\u0435\u043C
\u2014 \u0418\u043C\u044F, \u043D\u043E\u043C\u0435\u0440 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0430, \u0430\u0434\u0440\u0435\u0441 \u044D\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u043E\u0439 \u043F\u043E\u0447\u0442\u044B \u0438 \u0430\u0434\u0440\u0435\u0441 \u0434\u043E\u0441\u0442\u0430\u0432\u043A\u0438.
\u2014 \u0418\u0441\u0442\u043E\u0440\u0438\u044F \u0437\u0430\u043A\u0430\u0437\u043E\u0432 \u0438 \u0441\u043E\u0434\u0435\u0440\u0436\u0438\u043C\u043E\u0435 \u043A\u043E\u0440\u0437\u0438\u043D\u044B.
\u2014 \u0424\u0430\u0439\u043B\u044B cookie \u0434\u043B\u044F \u0440\u0430\u0431\u043E\u0442\u044B \u043A\u043E\u0440\u0437\u0438\u043D\u044B \u0438, \u0441 \u0432\u0430\u0448\u0435\u0433\u043E \u0441\u043E\u0433\u043B\u0430\u0441\u0438\u044F, \u0430\u043D\u0430\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u0435 cookie.

2. \u041A\u0430\u043A \u043C\u044B \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u043C \u0434\u0430\u043D\u043D\u044B\u0435
\u0414\u043B\u044F \u043E\u0431\u0440\u0430\u0431\u043E\u0442\u043A\u0438 \u0438 \u0434\u043E\u0441\u0442\u0430\u0432\u043A\u0438 \u0437\u0430\u043A\u0430\u0437\u043E\u0432, \u043E\u0431\u0440\u0430\u0442\u043D\u043E\u0439 \u0441\u0432\u044F\u0437\u0438 \u0438, \u0435\u0441\u043B\u0438 \u0432\u044B \u0434\u0430\u043B\u0438 \u0441\u043E\u0433\u043B\u0430\u0441\u0438\u0435, \u0434\u043B\u044F \u0440\u0430\u0441\u0441\u044B\u043B\u043A\u0438 \u043E \u0441\u043A\u0438\u0434\u043A\u0430\u0445. \u041E\u0442 \u0440\u0430\u0441\u0441\u044B\u043B\u043A\u0438 \u043C\u043E\u0436\u043D\u043E \u043E\u0442\u043F\u0438\u0441\u0430\u0442\u044C\u0441\u044F \u043F\u043E \u0441\u0441\u044B\u043B\u043A\u0435 \u0432 \u043B\u044E\u0431\u043E\u043C \u043F\u0438\u0441\u044C\u043C\u0435.

043D\u044B."]],lawTitle:"\u0417\u0430\u043A\u043E\u043D\u043E\u0434\u0430\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E \u041A\u044B\u0440\u0433\u044B\u0437\u0441\u0442\u0430\u043D\u0430",draft:"\u0427\u0435\u0440\u043D\u043E\u0432\u0438\u043A",draftNote:"\u042D\u0442\u043E\u0442 \u0431\u043B\u043E\u043A \u043F\u0440\u043E\u0432\u0435\u0440\u044F\u0435\u0442\u0441\u044F \u043A\u043E\u043C\u0430\u043D\u0434\u043E\u0439. \u041D\u043E\u043C\u0435\u0440\u0430 \u0441\u0442\u0430\u0442\u0435\u0439 \u0438 \u0442\u043E\u0447\u043D\u044B\u0435 \u0444\u043E\u0440\u043C\u0443\u043B\u0438\u0440\u043E\u0432\u043A\u0438 \u0431\u0443\u0434\u0443\u0442 \u0434\u043E\u0431\u0430\u0432\u043B\u0435\u043D\u044B \u043F\u043E\u0441\u043B\u0435 \u043F\u0440\u043E\u0432\u0435\u0440\u043A\u0438.",law:[["\u041A\u043E\u043D\u0441\u0442\u0438\u0442\u0443\u0446\u0438\u044F \u041A\u044B\u0440\u0433\u044B\u0437\u0441\u043A\u043E\u0439 \u0420\u0435\u0441\u043F\u0443\u0431\u043B\u0438\u043A\u0438","\u0413\u0430\u0440\u0430\u043D\u0442\u0438\u0440\u0443\u0435\u0442 \u043F\u0440\u0430\u0432\u043E \u043D\u0430 \u043D\u0435\u043F\u0440\u0438\u043A\u043E\u0441\u043D\u043E\u0432\u0435\u043D\u043D\u043E\u0441\u0442\u044C \u0447\u0430\u0441\u0442\u043D\u043E\u0439 \u0436\u0438\u0437\u043D\u0438, \u0442\u0430\u0439\u043D\u0443 \u043F\u0435\u0440\u0435\u043F\u0438\u0441\u043A\u0438 \u0438 \u0441\u043E\u043E\u0431\u0449\u0435\u043D\u0438\u0439. \u0421\u0431\u043E\u0440 \u0438 \u0440\u0430\u0441\u043F\u0440\u043E\u0441\u0442\u0440\u0430\u043D\u0435\u043D\u0438\u0435 \u0441\u0432\u0435\u0434\u0435\u043D\u0438\u0439 \u043E \u0447\u0430\u0441\u0442\u043D\u043E\u0439 \u0436\u0438\u0437\u043D\u0438 \u0431\u0435\u0437 \u0441\u043E\u0433\u043B\u0430\u0441\u0438\u044F \u0447\u0435\u043B\u043E\u0432\u0435\u043A\u0430 \u043E\u0433\u0440\u0430\u043D\u0438\u0447\u0435\u043D\u044B \u0437\u0430\u043A\u043E\u043D\u043E\u043C."],["\u0417\u0430\u043A\u043E\u043D \xAB\u041E\u0431 \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u0438 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u043E\u0433\u043E \u0445\u0430\u0440\u0430\u043A\u0442\u0435\u0440\u0430\xBB","\u0423\u0441\u0442\u0430\u043D\u0430\u0432\u043B\u0438\u0432\u0430\u0435\u0442 \u043F\u0440\u0430\u0432\u0438\u043B\u0430 \u0441\u0431\u043E\u0440\u0430, \u043E\u0431\u0440\u0430\u0431\u043E\u0442\u043A\u0438 \u0438 \u043F\u0435\u0440\u0435\u0434\u0430\u0447\u0438 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0445 \u0434\u0430\u043D\u043D\u044B\u0445 \u0438 \u043F\u0440\u0430\u0432\u0430 \u0441\u0443\u0431\u044A\u0435\u043A\u0442\u0430 \u0434\u0430\u043D\u043D\u044B\u0445."],["\u0423\u043F\u043E\u043B\u043D\u043E\u043C\u043E\u0447\u0435\u043D\u043D\u044B\u0439 \u043E\u0440\u0433\u0430\u043D \u043F\u043E \u0437\u0430\u0449\u0438\u0442\u0435 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0445 \u0434\u0430\u043D\u043D\u044B\u0445","\u0413\u043E\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0439 \u043E\u0440\u0433\u0430\u043D, \u043A\u043E\u0442\u043E\u0440\u044B\u0439 \u043A\u043E\u043D\u0442\u0440\u043E\u043B\u0438\u0440\u0443\u0435\u0442 \u043E\u0431\u0440\u0430\u0431\u043E\u0442\u043A\u0443 \u0434\u0430\u043D\u043D\u044B\u0445 \u0438 \u043F\u0440\u0438\u043D\u0438\u043C\u0430\u0435\u0442 \u0436\u0430\u043B\u043E\u0431\u044B \u0433\u0440\u0430\u0436\u0434\u0430\u043D. \u041D\u0430\u0437\u0432\u0430\u043D\u0438\u0435 \u0438 \u043A\u043E\u043D\u0442\u0430\u043A\u0442\u044B \u2014 \u0443\u0442\u043E\u0447\u043D\u0438\u0442\u044C."]],habitsTitle:"\u041F\u044F\u0442\u044C \u043F\u0440\u0438\u0432\u044B\u0447\u0435\u043A \u0437\u0430\u0449\u0438\u0442\u044B",habits:["\u041F\u0435\u0440\u0435\u0434 \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u043A\u043E\u0439 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F \u043F\u0440\u043E\u0432\u0435\u0440\u044F\u0439, \u043A\u0430\u043A\u0438\u0435 \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u044F \u043E\u043D\u043E \u043F\u0440\u043E\u0441\u0438\u0442. \u0422\u0430\u043A\u0441\u0438 \u043D\u0435 \u043D\u0443\u0436\u0435\u043D \u0434\u043E\u0441\u0442\u0443\u043F \u043A \u043A\u043E\u043D\u0442\u0430\u043A\u0442\u0430\u043C.","\u0412\u044B\u043A\u043B\u044E\u0447\u0430\u0439 \u0433\u0435\u043E\u043B\u043E\u043A\u0430\u0446\u0438\u044E \xAB\u0432\u0441\u0435\u0433\u0434\u0430\xBB \u2014 \u043E\u0441\u0442\u0430\u0432\u043B\u044F\u0439 \xAB\u0442\u043E\u043B\u044C\u043A\u043E \u043F\u0440\u0438 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u043D\u0438\u0438\xBB.","\u041D\u0435 \u0432\u0445\u043E\u0434\u0438 \u0432\u0435\u0437\u0434\u0435 \u0447\u0435\u0440\u0435\u0437 \u043E\u0434\u043D\u0443 \u0441\u043E\u0446\u0441\u0435\u0442\u044C: \u0442\u0430\u043A \u043E\u043D\u0430 \u0443\u0437\u043D\u0430\u0451\u0442, \u0447\u0435\u043C \u0442\u044B \u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0448\u044C\u0441\u044F.","\u0420\u0430\u0437 \u0432 \u043F\u043E\u043B\u0433\u043E\u0434\u0430 \u0443\u0434\u0430\u043B\u044F\u0439 \u0430\u043A\u043A\u0430\u0443\u043D\u0442\u044B, \u043A\u043E\u0442\u043E\u0440\u044B\u043C\u0438 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0448\u044C\u0441\u044F.","\u0412\u0438\u0434\u0438\u0448\u044C \u0434\u043B\u0438\u043D\u043D\u0443\u044E \u043F\u043E\u043B\u0438\u0442\u0438\u043A\u0443 \u2014 \u043F\u0440\u043E\u0433\u043E\u043D\u0438 \u0435\u0451 \u0447\u0435\u0440\u0435\u0437 \u041A\u0430\u043B\u043A\u0430\u043D \u0437\u0430 \u043C\u0438\u043D\u0443\u0442\u0443."],cta:"\u041F\u0440\u043E\u0432\u0435\u0440\u0438\u0442\u044C \u0441\u0435\u0440\u0432\u0438\u0441"},ky:{kicker:"\u0411\u0430\u0430\u0442\u044B\u0440\u0434\u044B\u043D \u043C\u0430\u0430\u043B\u044B\u043C\u0434\u0430\u043C\u0430\u0441\u044B",title:"\u0421\u0435\u043D\u0438\u043D \u0443\u043A\u0443\u043A\u0442\u0430\u0440\u044B\u04A3",lead:"\u0421\u0435\u043D\u0438\u043D \u043C\u0430\u0430\u043B\u044B\u043C\u0430\u0442\u0442\u0430\u0440\u044B\u04A3 \u2014 \u0441\u0435\u043D\u0438\u043D \u0431\u0438\u0440 \u0431\u04E9\u043B\u04AF\u0433\u04AF\u04A3. \u041A\u0430\u0430\u043B\u0430\u0433\u0430\u043D \u0441\u0430\u0439\u0442\u0442\u0430\u043D \u0436\u0435 \u0442\u0438\u0440\u043A\u0435\u043C\u0435\u0434\u0435\u043D \u044D\u043C\u043D\u0435\u043D\u0438 \u0442\u0430\u043B\u0430\u043F \u043A\u044B\u043B\u0430 \u0430\u043B\u0430\u0440\u044B\u04A3\u0434\u044B \u0431\u0438\u043B.",humanTitle:"\u041A\u0443\u043F\u0443\u044F\u043B\u044B\u043A \u2014 \u0430\u0434\u0430\u043C\u0434\u044B\u043D \u0443\u043A\u0443\u0433\u0443",human:["\u0416\u0435\u043A\u0435 \u0442\u0443\u0440\u043C\u0443\u0448\u0442\u0443\u043D \u043A\u043E\u043B \u0442\u0438\u0439\u0431\u0435\u0441\u0442\u0438\u0433\u0438\u043D\u0435 \u0443\u043A\u0443\u043A \u0410\u0434\u0430\u043C \u0443\u043A\u0443\u043A\u0442\u0430\u0440\u044B\u043D\u044B\u043D \u0436\u0430\u043B\u043F\u044B \u0434\u0435\u043A\u043B\u0430\u0440\u0430\u0446\u0438\u044F\u0441\u044B\u043D\u0434\u0430 (12-\u0431\u0435\u0440\u0435\u043D\u0435) \u0436\u0430\u043D\u0430 \u0416\u0430\u0440\u0430\u043D\u0434\u044B\u043A \u0436\u0430\u043D\u0430 \u0441\u0430\u044F\u0441\u0438\u0439 \u0443\u043A\u0443\u043A\u0442\u0430\u0440 \u0436\u04E9\u043D\u04AF\u043D\u0434\u04E9 \u044D\u043B \u0430\u0440\u0430\u043B\u044B\u043A \u043F\u0430\u043A\u0442\u0442\u0430 (17-\u0431\u0435\u0440\u0435\u043D\u0435) \u0431\u0435\u043A\u0438\u0442\u0438\u043B\u0433\u0435\u043D.","\u0416\u0418 \u0434\u043E\u043E\u0440\u0443\u043D\u0434\u0430 \u0441\u0435\u043D \u0442\u0443\u0443\u0440\u0430\u043B\u0443\u0443 \u043C\u0430\u0430\u043B\u044B\u043C\u0430\u0442\u0442\u044B \u043C\u0443\u0440\u0434\u0430 \u043C\u04AF\u043C\u043A\u04AF\u043D \u0431\u043E\u043B\u0431\u043E\u0433\u043E\u043D \u043C\u0430\u0441\u0448\u0442\u0430\u0431\u0434\u0430 \u0447\u043E\u0433\u0443\u043B\u0442\u0443\u043F, \u0441\u0430\u043B\u044B\u0448\u0442\u044B\u0440\u044B\u043F, \u043A\u043E\u043B\u0434\u043E\u043D\u0441\u043E \u0431\u043E\u043B\u043E\u0442: \u0436\u0430\u0440\u043D\u0430\u043C\u0430 \u043A\u04E9\u0440\u0441\u04E9\u0442\u04AF\u04AF, \u0441\u0430\u0433\u0430 \u0431\u0430\u0430 \u0431\u0435\u0440\u04AF\u04AF, \u0441\u0435\u043D \u0442\u0443\u0443\u0440\u0430\u043B\u0443\u0443 \u0447\u0435\u0447\u0438\u043C \u043A\u0430\u0431\u044B\u043B \u0430\u043B\u0443\u0443 \u04AF\u0447\u04AF\u043D. \u0411\u04AF\u0433\u04AF\u043D \u043C\u0430\u0430\u043B\u044B\u043C\u0430\u0442\u0442\u0430\u0440\u0434\u044B \u043A\u043E\u0440\u0433\u043E\u043E \u2014 \u0431\u0443\u043B \u044D\u0440\u043A\u0438\u043D\u0434\u0438\u043A\u0442\u0438, \u0442\u0435\u04A3\u0434\u0438\u043A\u0442\u0438 \u0436\u0430\u043D\u0430 \u0434\u0430\u0439\u044B\u043C\u0430 \u043A\u04E9\u0437\u04E9\u043C\u04E9\u043B\u0434\u04E9 \u0431\u043E\u043B\u0431\u043E\u043E \u0443\u043A\u0443\u0433\u0443\u043D \u043A\u043E\u0440\u0433\u043E\u043E."],whatTitle:"\u0416\u0435\u043A\u0435 \u043C\u0430\u0430\u043B\u044B\u043C\u0430\u0442 \u0434\u0435\u0433\u0435\u043D \u044D\u043C\u043D\u0435",what:"\u0421\u0435\u043D\u0438 \u0442\u04AF\u0437\u0434\u04E9\u043D-\u0442\u04AF\u0437 \u0436\u0435 \u0431\u0430\u0448\u043A\u0430 \u043C\u0430\u0430\u043B\u044B\u043C\u0430\u0442\u0442\u0430\u0440 \u043C\u0435\u043D\u0435\u043D \u0431\u0438\u0440\u0433\u0435 \u0442\u0430\u0430\u043D\u044B\u0441\u0430 \u0431\u043E\u043B\u043E \u0442\u0443\u0440\u0433\u0430\u043D \u0430\u0440 \u043A\u0430\u043D\u0434\u0430\u0439 \u043C\u0430\u0430\u043B\u044B\u043C\u0430\u0442.",examples:["\u0410\u0442\u044B-\u0436\u04E9\u043D\u04AF","\u0422\u0435\u043B\u0435\u0444\u043E\u043D \u043D\u043E\u043C\u0435\u0440\u0438","\u0416\u0435\u043A\u0435 \u043D\u043E\u043C\u0435\u0440 (\u041F\u0418\u041D)","\u0421\u04AF\u0440\u04E9\u0442 \u0436\u0430\u043D\u0430 \u04AF\u043D","\u0413\u0435\u043E\u043B\u043E\u043A\u0430\u0446\u0438\u044F","IP-\u0434\u0430\u0440\u0435\u043A","\u0421\u0430\u0442\u044B\u043F \u0430\u043B\u0443\u0443\u043B\u0430\u0440 \u0442\u0430\u0440\u044B\u0445\u044B","\u041C\u0430\u043D\u0436\u0430 \u0438\u0437\u0438, \u0436\u04AF\u0437"],powersTitle:"\u041A\u043E\u043B\u0434\u043E\u043D\u0443\u0443\u0447\u0443\u043D\u0443\u043D \u0430\u043B\u0442\u044B \u0441\u0443\u043F\u0435\u0440 \u043A\u04AF\u0447\u04AF",powers:[["\u0411\u0438\u043B\u04AF\u04AF","\u0421\u0435\u043D \u0442\u0443\u0443\u0440\u0430\u043B\u0443\u0443 \u043A\u0430\u043D\u0434\u0430\u0439 \u043C\u0430\u0430\u043B\u044B\u043C\u0430\u0442 \u0447\u043E\u0433\u0443\u043B\u0442\u0443\u043B\u0433\u0430\u043D\u044B\u043D, \u044D\u043C\u043D\u0435 \u04AF\u0447\u04AF\u043D \u0436\u0430\u043D\u0430 \u043A\u0438\u043C\u0433\u0435 \u0431\u0435\u0440\u0438\u043B\u0433\u0435\u043D\u0438\u043D \u0441\u0443\u0440\u043E\u043E."],["\u041E\u04A3\u0434\u043E\u043E","\u0422\u0443\u0443\u0440\u0430 \u044D\u043C\u0435\u0441 \u0436\u0435 \u044D\u0441\u043A\u0438\u0440\u0433\u0435\u043D \u043C\u0430\u0430\u043B\u044B\u043C\u0430\u0442\u0442\u044B \u043E\u04A3\u0434\u043E\u043E\u043D\u0443 \u0442\u0430\u043B\u0430\u043F \u043A\u044B\u043B\u0443\u0443."],["\u04E8\u0447\u04AF\u0440\u04AF\u04AF","\u041C\u0430\u0430\u043B\u044B\u043C\u0430\u0442 \u043C\u044B\u043D\u0434\u0430\u043D \u0430\u0440\u044B \u043A\u0435\u0440\u0435\u043A \u0431\u043E\u043B\u0431\u043E\u0441\u043E \u0436\u0435 \u043C\u044B\u0439\u0437\u0430\u043C\u0441\u044B\u0437 \u0447\u043E\u0433\u0443\u043B\u0442\u0443\u043B\u0441\u0430, \u0430\u043D\u044B \u04E9\u0447\u04AF\u0440\u04AF\u04AF\u043D\u04AF \u0442\u0430\u043B\u0430\u043F \u043A\u044B\u043B\u0443\u0443."],["\u041C\u0430\u043A\u0443\u043B\u0434\u0443\u043A\u0442\u0443 \u043A\u0430\u0439\u0442\u0430\u0440\u0443\u0443","\u041C\u0443\u0440\u0434\u0430 \u043C\u0430\u043A\u0443\u043B \u0431\u043E\u043B\u0433\u043E\u043D \u0438\u0448\u0442\u0435\u0442\u04AF\u04AF\u0433\u04E9 \xAB\u0442\u043E\u043A\u0442\u043E\xBB \u0434\u0435\u043F \u0430\u0439\u0442\u0443\u0443."],["\u041A\u0430\u0440\u0448\u044B \u0447\u044B\u0433\u0443\u0443","\u0416\u0430\u0440\u043D\u0430
