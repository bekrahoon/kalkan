plugins {
    id 'com.android.application'
}

android {
    namespace 'kg.kalkancheck.guard'
    compileSdk 34

    defaultConfig {
        applicationId 'kg.kalkancheck.guard'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }

    // Fixed key so new builds install over old ones (demo key, not a secret).
    signingConfigs {
        kalkan {
            storeFile file('kalkan-release.jks')
            storePassword 'kalkancheck'
            keyAlias 'kalkan'
            keyPassword 'kalkancheck'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.kalkan
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.kalkan
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
