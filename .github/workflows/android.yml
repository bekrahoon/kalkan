name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk KalkanCheck-Guard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KalkanCheck-Guard
          path: KalkanCheck-Guard.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "KalkanCheck Защитник (Android)"
          body: "Последняя сборка приложения KalkanCheck Защитник. Скачайте KalkanCheck-Guard.apk на Android-телефон и установите."
          prerelease: false
          make_latest: true
          files: KalkanCheck-Guard.apk
