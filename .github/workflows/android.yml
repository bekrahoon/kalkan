name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if ! gradle assembleRelease --no-daemon 2>&1 | tee build.log; then
            # surface compile errors as annotations (job logs are hard to read remotely)
            grep -E "error:|What went wrong|e: |FAILURE|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk KalkanCheck-Guard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KalkanCheck-Guard
          path: KalkanCheck-Guard.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "KalkanCheck Защитник (Android)"
          body: "Последняя сборка приложения KalkanCheck Защитник. Скачайте KalkanCheck-Guard.apk на Android-телефон и установите."
          prerelease: false
          make_latest: true
          files: KalkanCheck-Guard.apk
