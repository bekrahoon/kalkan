name: Android E2E

# Installs the APK on an emulator, sends a scam notification and records what happens.
# Screenshots and logs are pushed to the e2e-results branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/e2e-trigger"

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../app.apk

      - name: API smoke test
        shell: bash
        run: |
          set -x
          B=https://kalkan-sigma.vercel.app/api/device
          reg=$(curl -s -X POST $B -H 'content-type: application/json' -d '{"action":"register","name":"E2E Тест","lang":"ru"}')
          echo "$reg" > api_register.json
          id=$(echo "$reg" | jq -r .id); secret=$(echo "$reg" | jq -r .secret)
          echo "DEV_ID=$id" >> $GITHUB_ENV; echo "DEV_SECRET=$secret" >> $GITHUB_ENV
          curl -s -X POST $B -H 'content-type: application/json' -d "{\"action\":\"status\",\"id\":\"$id\",\"secret\":\"$secret\"}" > api_status.json
          curl -s -X POST $B -H 'content-type: application/json' -d "{\"action\":\"link\",\"id\":\"$id\",\"secret\":\"$secret\"}" > api_link.json
          curl -s -m 70 -X POST $B -H 'content-type: application/json' -d "{\"action\":\"check\",\"id\":\"$id\",\"secret\":\"$secret\",\"text\":\"Здравствуйте! Служба безопасности банка. Ваша карта заблокирована. Срочно перейдите по ссылке http://bit.ly/kart-unblock и назовите код из СМС\",\"app\":\"WhatsApp\"}" > api_check.json
          curl -s -X POST $B -H 'content-type: application/json' -d '{"action":"status","id":"0000000000000000","secret":"x"}' > api_unauth.json
          for f in api_*.json; do echo "::notice title=$f::$(head -c 600 $f)"; done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/e2e.sh

      - name: Publish results
        if: always()
        shell: bash
        run: |
          mkdir -p out && cp -r e2e/* out/ 2>/dev/null || true
          cp api_*.json out/ 2>/dev/null || true
          cd out
          # results only: tell Vercel not to deploy this branch
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q && git checkout -q -b e2e-results
          git config user.name e2e && git config user.email e2e@users.noreply.github.com
          git add -A && git commit -qm "e2e $GITHUB_SHA" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" e2e-results
